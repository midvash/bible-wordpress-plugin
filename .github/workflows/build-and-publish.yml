name: Build & Publish plugin ZIP

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write   # upload release assets

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Build ZIP, attach to release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install build deps
        run: npm install --no-save tsx

      - name: Read version from midvash-bible-references.php
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -E "^\s*\*\s*Version:" midvash-bible-references.php | sed -E 's/.*Version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Plugin version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version coherence (header / MVBR_VERSION / readme.txt)
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          MVBR_CONST=$(grep -oE "MVBR_VERSION', '[^']+'" midvash-bible-references.php | sed -E "s/.*'([0-9.]+)'/\1/")
          STABLE_TAG=$(grep -E "^Stable tag:" readme.txt | sed -E 's/.*:\s*//')
          echo "Header:    $VERSION"
          echo "Constant:  $MVBR_CONST"
          echo "Stable tag:$STABLE_TAG"
          if [ "$VERSION" != "$MVBR_CONST" ]; then
            echo "::error::Header version ($VERSION) ≠ MVBR_VERSION constant ($MVBR_CONST)"
            exit 1
          fi
          if [ "$VERSION" != "$STABLE_TAG" ]; then
            echo "::error::Header version ($VERSION) ≠ readme.txt Stable tag ($STABLE_TAG)"
            exit 1
          fi
          if ! grep -qE "^= ${VERSION//./\\.} =$" readme.txt; then
            echo "::error::No changelog entry for $VERSION in readme.txt"
            exit 1
          fi

      # One ZIP for wordpress.org and the GitHub Release. The R2 channel
      # (update-info.json + bible-by-midvash-*.zip, read by the old
      # plugin-update-checker) stays frozen at 0.10.3: pushing this renamed
      # plugin there would swap the main file under installs of the old
      # bible-by-midvash folder and WordPress would deactivate them.
      - name: Build ZIP
        run: npx tsx scripts/build-zip.ts
        env:
          MVBR_PLUGIN_KEY: ${{ secrets.BBMV_PLUGIN_KEY }}

      - name: Attach ZIP to GitHub Release
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/midvash-bible-references-${{ steps.version.outputs.version }}.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release publica de verdade. Rodar o workflow à mão é só um ensaio:
      # monta o pacote, mostra o que mudaria e não envia nada.
      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Publish to wordpress.org (SVN)
        run: |
          scripts/deploy-wporg.sh "${{ steps.version.outputs.version }}" \
            "dist/midvash-bible-references-${{ steps.version.outputs.version }}.zip"
        env:
          DRY_RUN: ${{ github.event_name != 'release' }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
